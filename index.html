<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radiestesia SOLAR — Limpeza e Proteção</title>
<style>
:root{
  --ink:#322d35;--muted:#746d77;--line:#ddd5dd;--paper:#fff;--bg:#f8f5f2;
  --accent:#7b536e;--accent-soft:#f3eaf0;--warm:#fffaf5;--success:#577263;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#fbf8f5 0,#f6f2f0 100%);color:var(--ink);font-family:Arial,sans-serif;font-size:14px;line-height:1.45}
.app{max-width:1180px;margin:28px auto;padding:0 18px 70px}
.top{background:rgba(255,255,255,.96);border:1px solid #e7dfe5;padding:24px 26px;margin-bottom:18px;border-radius:18px;box-shadow:0 8px 30px rgba(54,38,52,.07)}
.top h1{font-size:22px;margin:0 0 5px;letter-spacing:.2px;color:#4f384b}
.top p{margin:0;color:var(--muted)}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px;align-items:center}
button{border:1px solid #cbbfc8;background:#fff;padding:10px 15px;border-radius:10px;cursor:pointer;color:#493f49;font-weight:600;transition:.15s ease;box-shadow:0 2px 7px rgba(45,32,44,.04)}
button:hover{transform:translateY(-1px);border-color:#a987a0;box-shadow:0 5px 12px rgba(45,32,44,.08)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.save{font-size:12px;color:var(--success);margin-left:auto;align-self:center;background:#f0f6f2;border-radius:999px;padding:5px 9px}
details{background:#fff;border:1px solid #e3dce2;margin:12px 0;border-radius:14px;overflow:hidden;box-shadow:0 4px 18px rgba(54,38,52,.045)}
summary{font-weight:700;padding:15px 18px;cursor:pointer;background:linear-gradient(180deg,#fff,#fcfafb);color:#503d4d;list-style-position:inside}
details[open] summary{border-bottom:1px solid #eee7ec;background:var(--accent-soft)}
.inside{padding:18px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.field{background:var(--warm);border:1px solid #eee5df;border-radius:11px;padding:10px}
.field label,.label{font-weight:700;display:block;margin-bottom:6px;color:#544b54}
.field input,.field textarea,.field select{width:100%;padding:9px 10px;border:1px solid #cbc2c9;border-radius:8px;font:inherit;background:#fff;color:var(--ink);outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#9e7893;box-shadow:0 0 0 3px rgba(123,83,110,.10)}
.field textarea{min-height:88px;resize:vertical}
.sub{font-size:16px;margin:20px 0 10px;border-bottom:1px solid #e5dde3;padding-bottom:7px;color:#654e60}
.checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px 11px}
.checks label{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:8px;transition:.12s ease}
.checks label:hover{background:#faf5f8}
.checks input{margin-top:3px;accent-color:var(--accent)}
.chakra-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px}
.chakra{border:1px solid #dfd5dd;text-align:center;padding:12px 6px;border-radius:12px;background:#fffafc;transition:.15s ease}
.chakra:hover{transform:translateY(-1px);box-shadow:0 5px 13px rgba(54,38,52,.07)}
input[type="checkbox"]{
  -webkit-appearance:none;appearance:none;
  width:18px;height:18px;min-width:18px;
  border:1.6px solid #b99cab;border-radius:50%;
  background:#fff;display:inline-grid;place-content:center;
  vertical-align:-3px;margin:0 7px 0 0;cursor:pointer;
  transition:.15s ease;
}
input[type="checkbox"]::before{
  content:"";width:8px;height:8px;border-radius:50%;
  transform:scale(0);transition:.12s transform ease-in-out;
  background:var(--accent);
}
input[type="checkbox"]:checked{border-color:var(--accent);background:#fff8fb}
input[type="checkbox"]:checked::before{transform:scale(1)}
input[type="checkbox"]:focus-visible{outline:2px solid #d8afc6;outline-offset:2px}
.chakra input[type="checkbox"]{margin-right:6px}
.bovis{overflow:auto;border-radius:10px}
.bovis table{width:100%;border-collapse:collapse;background:#fff}
.bovis th{background:#f7f1f5;color:#554551}
.bovis th,.bovis td{border:1px solid #ddd5dc;padding:8px}
.bovis input{width:100%;padding:7px;border:1px solid #cfc5cc;border-radius:6px}
.hint{font-size:12px;color:var(--muted);margin:5px 0 11px}
.report{display:none}
.report[contenteditable=true]{outline:none}
.rpage{background:#fff;color:#000;width:210mm;min-height:297mm;margin:12px auto;padding:14mm 14mm 15mm;font-family:"Arial Narrow",Arial,sans-serif;font-size:11pt;line-height:1.22;box-shadow:0 5px 24px rgba(0,0,0,.12)}
.rpage,.rpage *{color:#000!important;background:#fff!important}
.rpage h1{font-size:14pt;text-align:center;margin:0 0 10px}
.rpage h2{font-size:11.5pt;margin:10px 0 5px}
.rpage h3{font-size:11pt;margin:8px 0 4px}
.rtable{width:100%;border-collapse:collapse;margin:4px 0 9px}
.rtable th,.rtable td{border:1px solid #555;padding:4px 5px;vertical-align:top}
.rtable th{font-weight:700;text-align:left}
.rsection{break-inside:avoid;page-break-inside:avoid;margin-bottom:8px}
.editnote{font-size:10pt;margin-bottom:8px}
.empty{font-style:italic}
@media(max-width:800px){.grid,.grid3,.checks{grid-template-columns:1fr}.chakra-row{grid-template-columns:1fr}.save{margin-left:0;width:100%;text-align:center}.top{padding:20px}.inside{padding:14px}}
@page{size:A4;margin:14mm}
@media print{
 body{background:#fff;color:#000}
 .app{max-width:none;margin:0;padding:0}
 .app>.top,.form{display:none!important}
 .report{display:block!important}
 .rpage{width:auto;min-height:auto;margin:0;padding:0;box-shadow:none;font-family:"Arial Narrow",Arial,sans-serif;font-size:11pt;line-height:1.22;color:#000}
 .rpage,.rpage *{color:#000!important;background:#fff!important}
 .rsection,.rtable,tr,td,th,h1,h2,h3,p,div[contenteditable="true"]{break-inside:avoid;page-break-inside:avoid}
 h1,h2,h3{break-after:avoid;page-break-after:avoid}
 tr{break-inside:avoid!important;page-break-inside:avoid!important}
 .editnote{display:none}
}
</style></head><body><div class="app"><div class="top"><h1>RADIESTESIA SOLAR — LIMPEZA E PROTEÇÃO — ATENDIMENTO INICIAL</h1><p>Formulário eletrônico de atendimento e relatório editável.</p><div class="toolbar"><button class="primary" id="makeReport">Gerar / atualizar relatório</button><button id="printReport">Imprimir / salvar PDF</button><button id="backForm">Voltar ao formulário</button><button id="clearForm">Limpar atendimento</button><span class="save" id="saveStatus">Salvamento automático ativo</span></div></div><div class="form" id="form"></div><div class="report" id="report"></div></div>
<script>const DATA={"pizzol": {"Emocional": {"Básico": {"Rígido": {"Rejeição ou abandono": "Quando há feridas profundas de rejeição ou abandono, o campo emocional cria defesas rígidas para evitar sofrer novamente. A cliente pode se fechar completamente, acreditando que precisa se bastar, evitando criar vínculos verdadeiros por medo de ser deixada. Isso endurece o campo e gera um estado constante de alerta, onde qualquer aproximação já ativa mecanismos de autoproteção, mesmo que o outro não represente uma ameaça real.", "Ressentimento ou mágoas não liberadas": "Mágoas acumuladas funcionam como âncoras emocionais que mantêm a pessoa presa ao passado. No chakra básico, isso gera estagnação, sensação de peso e resistência à mudança. A cliente pode manter distância dos outros por medo de reviver dores antigas, e essa rigidez emocional impede que a energia flua livremente. O campo se torna denso, fechado, e a pessoa se torna pouco receptiva a novas experiências ou vínculos.", "Medo de intimidade": "Esse medo bloqueia o acesso à raiz do vínculo. A cliente teme que, ao se abrir, seja invadida ou se perca de si mesma. Essa crença cria barreiras energéticas que a impedem de se entregar com presença. O campo vibra numa frequência de autodefesa, em que toda aproximação é percebida como ameaça. O vínculo com o outro é evitado, e até com o próprio corpo pode haver distanciamento ou tensão constante.", "Traumas de abuso, controle ou manipulação": "Experiências traumáticas criam campos de proteção excessiva. No chakra básico, isso gera um padrão de desconfiança profunda, onde a cliente sente que o mundo é perigoso e precisa estar sempre em alerta. O corpo vibra no medo, a energia vital é drenada, e qualquer tentativa de conexão é automaticamente filtrada por memórias de dor. A presença da pessoa se torna fragmentada, e o campo se fecha como forma de sobrevivência.", "Necessidade de manter o controle emocional": "A cliente acredita que demonstrar sentimentos é sinal de fraqueza. Por isso, bloqueia impulsos, suprime emoções e tenta manter tudo sob controle. Essa rigidez emocional desconecta a pessoa do próprio corpo e cria uma blindagem que a impede de se sentir protegida de forma natural. O campo se fortalece de fora para dentro, mas enfraquece internamente, pois não há fluidez nem presença verdadeira."}, "Solto": {"Carência afetiva": "A carência afetiva no chakra básico gera uma busca constante por acolhimento externo, mesmo que inconsciente. A cliente sente um vazio profundo e tenta preenchê-lo através de conexões imediatas, presença constante de alguém ou busca por atenção. Esse padrão abre brechas no campo, pois ela se torna energeticamente disponível a qualquer presença que prometa acolhimento, mesmo que tóxica ou incoerente. A falta de filtro vibracional a torna vulnerável, e o chakra vibra numa frequência de necessidade, não de estabilidade.", "Rejeição ou abandono": "Quando a ferida de rejeição não cria defesas rígidas, ela se manifesta como uma entrega desmedida. A cliente pode se aproximar rapidamente dos outros, aceitar qualquer tipo de tratamento e ter dificuldade de romper vínculos nocivos por medo de reviver o abandono. O campo se molda ao externo, permitindo invasões, repetições de padrão e perda da força vital. Há uma confusão entre presença e dependência, e a base energética fica enfraquecida.", "Dependência emocional": "Nesse padrão, o chakra básico não sustenta autonomia. A cliente se ancora emocionalmente nos outros, esperando que eles preencham suas faltas internas. Essa dependência cria conexões desequilibradas, onde ela cede sua energia vital em troca de uma sensação passageira de segurança. O campo se torna poroso, com vínculos abertos e recorrência de padrões de entrega excessiva, esgotamento e apego.", "Falta de autorregulação": "Sem autorregulação emocional, a cliente oscila entre intensidade e apatia. Não consegue sustentar seus próprios estados internos e acaba absorvendo o que está ao redor. Essa instabilidade gera um campo vulnerável, onde emoções alheias se misturam às dela, e a base vibracional fica desorganizada. A sensação de estar sempre à mercê do ambiente é comum, assim como a dificuldade de manter decisões firmes ou rotinas estruturadas.", "Vínculos abertos": "Quando a cliente mantém conexões emocionais do passado sem encerramento consciente, o chakra básico permanece energeticamente vinculado a histórias antigas. Esses vínculos abertos drenam energia, enfraquecem o presente e mantêm a pessoa ligada a situações que já não servem mais. O campo apresenta rachaduras, e a sensação de cansaço ou confusão pode estar relacionada a essas conexões não dissolvidas.", "Culpa": "A culpa é um fator silencioso que abre o campo e impede a sustentação da própria presença. No chakra básico, ela gera autossabotagem, dificuldade de receber e sensação de não merecimento. A cliente pode aceitar situações injustas ou dolorosas como uma forma inconsciente de compensação, mantendo-se disponível para repetir padrões de dor. A energia vital se fragmenta, e a base do campo vibra em desvalorização."}}, "Sacral": {"Rígido": {"Rejeição ou abandono": "A cliente internalizou experiências de rejeição ou abandono e, para não reviver essas dores, ergue barreiras afetivas. Evita vínculos profundos ou se envolve sem se entregar por inteiro. Essa defesa emocional pode parecer força, mas na verdade é medo travestido de autonomia. O campo se fecha para o contato real, criando rigidez vibracional no chakra sacral.", "Ressentimento ou mágoas não liberadas": "Feridas afetivas mal resolvidas se tornam acúmulos energéticos que cristalizam o campo. A cliente pode alimentar mágoas antigas, culpar o outro ou guardar ressentimentos como forma de se proteger. Mas essa retenção impede o fluxo emocional e intoxica o chakra. A rigidez não é firmeza, mas congelamento de uma dor que não foi digerida.", "Medo de intimidade": "A vulnerabilidade necessária para se vincular assusta. A cliente teme se entregar, se mostrar, se permitir sentir. Por isso, mantém uma distância segura, mas vibracionalmente desconectada. Essa defesa emocional torna o chakra sacral reativo, impedindo a troca verdadeira e gerando ressecamento energético ou desvitalização afetiva.", "Traumas de abuso, controle ou manipulação": "Vivências traumáticas relacionadas à sexualidade ou relações de poder criam bloqueios profundos nesse centro. A cliente pode sentir que precisa se proteger o tempo todo, e por isso endurece o campo emocional. Mesmo sem lembrar conscientemente, o corpo vibra alerta. O chakra sacral fica hiperprotegido, mas sem fluidez.", "Necessidade de manter o controle emocional": "A cliente acredita que sentir intensamente é perigoso. Para manter o controle, reprime emoções, disfarça afetos e racionaliza desejos. Essa tentativa de controle inibe o prazer, a conexão e a autenticidade. O chakra sacral entra em colapso entre o desejo de se expressar e a ordem mental de se conter."}, "Solto": {"Carência afetiva": "A necessidade de ser amada a qualquer custo faz com que a cliente ultrapasse seus próprios limites. Ela se doa demais, se envolve rápido, abre seu campo sem perceber. Busca no outro a validação que não encontrou em si. Essa carência deixa o chakra sacral vulnerável a interferências e padrões relacionais desequilibrados.", "Rejeição ou abandono": "Aqui, ao contrário da rigidez, a dor da rejeição se traduz em busca constante por acolhimento externo. A cliente se anula para não ser deixada, aceita migalhas, permanece em vínculos tóxicos por medo da solidão. Essa entrega sem limites abre brechas emocionais e torna o chakra um ponto de entrada para dores repetidas.", "Dependência emocional": "A cliente sente que não consegue viver sem o outro. Entrega o próprio centro de poder ao vínculo. Qualquer afastamento ou discordância vira ameaça. Essa fusão energética rompe os contornos do chakra sacral e o campo se desorganiza, pois a energia deixa de ser centrada e se torna dependente da presença externa.", "Falta de autorregulação": "As emoções vêm como ondas incontroláveis. A cliente não aprendeu a conter, nomear ou digerir o que sente. Com isso, oscila entre excessos e apagamentos emocionais. O campo fica permeável a tudo e o chakra sacral vibra em instabilidade, atraindo e absorvendo influências externas com facilidade.", "Vínculos abertos": "A cliente mantém laços energéticos com relações antigas, mal resolvidas ou intensas demais. Mesmo que o vínculo tenha acabado, ainda há trocas no campo. Esses laços funcionam como portais de entrada para interferências e drenagens. O chakra sacral permanece conectado a histórias que já deveriam ter sido encerradas.", "Culpa": "A cliente sente culpa por desejar, por sentir prazer, por priorizar a si mesma. Essa culpa pode ter raízes religiosas, familiares ou sociais. Ela se pune inconscientemente, boicotando a própria energia vital. O chakra sacral enfraquece porque não consegue sustentar prazer e nutrição emocional de forma íntegra."}}, "Plexo Solar": {"Rígido": {"Rejeição ou abandono": "A dor emocional não elaborada da rejeição ou abandono cria uma armadura vibracional. A cliente passa a sustentar defesas emocionais no plexo solar, acreditando que precisa controlar ou afastar os outros para não sentir novamente a dor que viveu. Essa rigidez fecha o fluxo natural da energia e gera um campo duro, reativo, que vibra desconfiança. A proteção deixa de ser presença e se torna resistência. Internamente, essa rigidez é uma tentativa de negar o medo de ser novamente deixada.", "Ressentimento ou mágoas não liberadas": "O acúmulo de mágoas mantidas no campo emocional endurece o plexo solar. A cliente carrega ressentimentos como formas de proteção inconsciente, acreditando que se soltar ou perdoar a tornaria vulnerável outra vez. Essa densidade emocional impede a fluidez energética e sustenta uma vibração defensiva e amarga, que bloqueia relações e, paradoxalmente, atrai novas dores. O campo se enrijece tentando se defender de um passado que ainda habita sua energia.", "Medo de intimidade": "A intimidade exige entrega e abertura, mas o medo de ser invadida, controlada ou ferida faz com que a cliente endureça o plexo solar como uma barreira. Essa rigidez impede a proximidade real com o outro, mesmo quando existe desejo por conexão. O campo permanece fechado por trás de uma aparente força, sustentando um controle que não protege, apenas isola. A vulnerabilidade real é mascarada por uma postura de independência absoluta.", "Traumas de abuso, controle ou manipulação": "Quando a cliente passou por experiências de controle, abuso ou manipulação, seu plexo solar registra essas memórias como ameaças. O campo se fecha, e a emoção se cristaliza como defesa. Há uma hipervigilância energética: tudo é analisado, previsto, contido. Essa tensão constante fragiliza o campo ao invés de protegê-lo, pois a energia vital é consumida tentando manter tudo sob controle. O trauma não elaborado se transforma em um limite rígido que impede a circulação do amor, da alegria e da confiança.", "Necessidade de manter o controle emocional": "A cliente acredita que sentir é perigoso. Por isso, tenta se proteger negando emoções, racionalizando tudo, mantendo uma postura constante de autocontrole. Essa contenção emocional, sustentada no plexo solar, cria uma blindagem que a impede de entrar em contato com sua energia real. A proteção se torna superficial, pois por dentro há tensão, repressão e medo. O campo perde autenticidade e resiliência, tornando-se vulnerável mesmo sob a aparência de força."}, "Solto": {"Carência afetiva": "Quando o plexo solar está fragilizado pela carência afetiva, a cliente se abre demais na esperança de ser acolhida, validada ou amada. Ela se adapta excessivamente, busca aprovação, oferece o que não tem. O campo se torna esponja, absorvendo tudo ao redor. Não há clareza sobre o que fortalece ou enfraquece sua energia, pois a necessidade de receber amor se sobrepõe à capacidade de se proteger. É uma abertura que não nasce da confiança, mas da urgência de ser vista.", "Rejeição ou abandono": "A dor não digerida da rejeição também pode gerar um movimento contrário ao endurecimento: a cliente tenta se manter disponível a qualquer custo. Tem medo de ser deixada e, por isso, se molda, se anula, permite invasões sutis e explícitas. O campo se desorganiza na tentativa inconsciente de evitar novas perdas. Há uma abertura desprotegida que se confunde com entrega, mas esconde a ferida da solidão.", "Dependência emocional": "A cliente entrega o próprio centro de força ao outro, acreditando que precisa da presença, opinião ou validação externa para se sentir segura. Essa dependência abre brechas no plexo solar, pois a autonomia vibracional é comprometida. Ela absorve dores que não são suas, aceita condições que ferem sua essência, e se fragiliza energeticamente toda vez que tenta sustentar vínculos à base da necessidade. A proteção se dissolve na ausência de presença interior.", "Falta de autorregulação": "Sem consciência emocional, a cliente oscila entre extremos. Reage impulsivamente, se desorganiza diante de situações simples, não sabe identificar seus próprios limites. Essa instabilidade fragiliza o plexo solar, abrindo espaço para interferências externas. O campo não sustenta firmeza nem flexibilidade. A cliente sente tudo, absorve tudo, mas não consegue digerir ou reorganizar o que sente. A ausência de autorregulação a torna vulnerável até em ambientes neutros.", "Vínculos abertos": "Relações mal resolvidas, laços que não foram encerrados energeticamente, vínculos de codependência ou antigos pactos emocionais mantêm o plexo solar em constante fuga ou vigilância. A cliente se sente puxada por memórias, histórias e pessoas. Seu campo permanece permeável ao que já deveria ter sido liberado. Essa abertura desnecessária suga sua força vital, dispersa sua presença e enfraquece sua capacidade de proteção vibracional real.", "Culpa": "A culpa é uma emoção que distorce a percepção dos próprios limites. A cliente sente que deve algo, que precisa se sacrificar, que não tem direito de recusar. Isso enfraquece seu plexo solar e a coloca em posições de constante vulnerabilidade energética. Ela diz sim quando queria dizer não, aceita quando queria recusar, sustenta o que não aguenta mais. A proteção falha porque sua energia está comprometida com compensações inconscientes."}}, "Cardíaco": {"Rígido": {"Rejeição ou abandono": "A ferida emocional causada pela rejeição ou pelo abandono pode gerar um fechamento profundo do chakra cardíaco. A pessoa cria uma armadura emocional para não sofrer novamente. Com isso, impede a entrada de afeto verdadeiro, mas também torna o campo mais denso e inflexível, o que dificulta a liberação energética de vínculos antigos. Essa rigidez impede que a limpeza aconteça com fluidez e que a proteção se estabeleça por confiança, criando em vez disso um sistema defensivo vibracional.", "Ressentimento ou mágoas não liberadas": "O acúmulo de mágoas cria um campo emocional tóxico que impede a liberação vibracional. O chakra cardíaco se fecha em dor, e essa cristalização afeta diretamente a capacidade de proteção energética, pois a pessoa permanece conectada a episódios ou pessoas que já deveriam ter sido liberados. O ressentimento mantém as brechas abertas, pois o campo continua preso ao passado.", "Medo de intimidade": "O medo de se abrir verdadeiramente gera uma defesa emocional constante. A pessoa acredita que, se se mostrar como realmente é, será ferida. Por isso, estabelece muros emocionais que impedem a troca energética. Esses muros, no entanto, não sustentam uma verdadeira proteção, eles apenas bloqueiam a circulação de energia, o que enfraquece o campo e favorece a rigidez.", "Traumas de abuso, controle ou manipulação": "Experiências traumáticas vividas no plano afetivo podem gerar uma contração energética profunda no cardíaco. A pessoa passa a se defender de tudo o que se aproxima, mesmo quando já está segura. Isso cria uma vibração de desconfiança e hiperalerta, que mantém o campo preso ao passado. A verdadeira proteção só acontece quando o trauma é reconhecido e liberado, e não quando é coberto por uma falsa força emocional.", "Necessidade de manter o controle emocional": "A tentativa de controlar as próprias emoções em excesso impede o fluxo natural do chakra cardíaco. A pessoa reprime sentimentos, mascara vulnerabilidades e tenta parecer sempre equilibrada, mesmo quando não está. Essa contenção afasta o contato real com o que está acontecendo, dificultando tanto a limpeza quanto a proteção, já que o campo se desconecta da verdade emocional."}, "Solto": {"Carência afetiva": "Quando o chakra cardíaco está marcado por uma carência afetiva profunda, a pessoa tende a abrir seu campo sem discernimento, buscando amor em qualquer forma de troca. Essa abertura desorganizada gera uma vulnerabilidade energética intensa, pois a necessidade de afeto fala mais alto que a percepção de segurança vibracional. A pessoa pode se conectar com ambientes ou relações densas, achando que está sendo acolhida, quando na verdade está sendo drenada.", "Rejeição ou abandono": "Nos limites soltos, essa ferida se expressa como busca incessante por aceitação. A pessoa não consegue se posicionar energeticamente, pois teme ser deixada ou excluída. Isso a leva a aceitar relações que ferem, situações que esgotam e conexões que não respeitam sua integridade. O campo se abre por medo de perder, e nesse movimento, a proteção se dissolve.", "Dependência emocional": "A dependência afetiva cria um campo que se entrega além do necessário. O chakra cardíaco vibra em função do outro, esperando aprovação, presença ou validação. Essa entrega sem medida deixa a pessoa desprotegida, pois ela perde a referência do próprio centro. A limpeza torna-se difícil, pois os vínculos não são encerrados, mesmo quando já estão prejudiciais.", "Falta de autorregulação": "A incapacidade de se autorregular emocionalmente gera um campo oscilante. A pessoa se abre demais em momentos de carência e se retrai intensamente quando se sente ameaçada. Essa instabilidade dificulta a sustentação da energia, tornando a proteção frágil e a limpeza ineficaz. O chakra não sustenta um fluxo contínuo, está sempre em estado de urgência afetiva.", "Vínculos abertos": "Quando o chakra cardíaco permanece conectado a pessoas ou situações do passado, sem um encerramento consciente, ele se torna um canal aberto para trocas energéticas inconscientes. Esses vínculos consomem vitalidade, alimentam pensamentos repetitivos e impedem a renovação vibracional. A verdadeira limpeza emocional exige encerramento, e a verdadeira proteção exige presença no agora.", "Culpa": "A culpa cria uma abertura vibracional disfarçada de reparação. A pessoa sente que precisa pagar, compensar ou se sacrificar, permitindo que outros invadam seu campo sem limites. O chakra cardíaco, nesse estado, não sustenta discernimento. A energia se entrega como forma de punição interna. É preciso reconhecer que proteger o próprio campo não é egoísmo, mas amor-próprio vibracional."}}, "Laríngeo": {"Rígido": {"Rejeição ou abandono": "Quando a dor de ser rejeitada se aloja no chakra laríngeo, a tendência emocional é silenciar para não ser exposta. A pessoa reprime sua expressão por medo de ser deixada, e com isso perde a força de sustentação vibracional da própria verdade. Essa contenção constante bloqueia a fluidez energética, gera tensão e cria um campo rígido, fechado ao fluxo natural. A proteção se torna um esforço, e a limpeza, um processo dificultado pela própria negação da dor.", "Ressentimento ou mágoas não liberadas": "Mágoas guardadas e não verbalizadas tornam-se acúmulos energéticos que endurecem o campo laríngeo. A pessoa retém palavras, histórias e dores que não foram digeridas, criando uma blindagem reativa: fala quando explode, ou não fala nunca. Essa retenção torna o campo pesado, ressonante com densidades passadas, dificultando processos de limpeza e impedindo que a proteção se estabeleça por alinhamento. O campo se fecha, mas continua contaminado por dentro.", "Medo de intimidade": "No laríngeo, esse medo se traduz em superficialidade na fala e resistência à escuta profunda. A pessoa não se permite ser verdadeira nem acolher a verdade do outro, criando um campo de proteção ilusória baseado em distanciamento verbal e intelectual. Porém, por dentro, essa defesa colapsa. O campo se torna rígido, mas frágil. A limpeza se torna superficial, e a proteção não se sustenta.", "Traumas de abuso, controle ou manipulação": "Quando a fala foi controlada ou violentada em experiências passadas, o chakra laríngeo se enrijece como forma de autoproteção. A pessoa pode ter dificuldade de se posicionar, falar com clareza ou até se expressar emocionalmente. Essa trava cria uma couraça energética que impede a entrada de luz no campo. A energia não circula, a limpeza se torna bloqueada e a proteção vibracional é reativa, não consciente.", "Necessidade de manter o controle emocional": "A tentativa de controlar tudo o que é dito, sentido ou expresso aprisiona o chakra laríngeo numa rigidez constante. A fala perde espontaneidade, a escuta se torna seletiva e o campo se fecha ao fluxo natural de comunicação energética. A proteção se torna uma máscara, e a limpeza, uma formalidade, sem real conexão com a verdade do ser."}, "Solto": {"Carência afetiva": "A carência afetiva, quando alojada no chakra laríngeo, se manifesta como uma expressão exagerada, carente de validação externa. A pessoa fala demais, busca ser ouvida o tempo todo, mas não sustenta presença na própria voz. Seu campo se abre a qualquer influência, pois seu dizer não nasce da essência, e sim da necessidade de acolhimento. Essa abertura sem discernimento enfraquece a proteção e dificulta a limpeza, já que a comunicação serve para agradar, e não para organizar a energia interna.", "Rejeição ou abandono": "Aqui, o medo de rejeição se traduz numa comunicação ansiosa, que busca aceitação a qualquer custo. A pessoa diz o que o outro quer ouvir, mesmo que isso fira sua verdade. Essa distorção enfraquece o chakra laríngeo e abre o campo a interferências. O campo parece receptivo, mas está vulnerável. A limpeza não se sustenta porque a energia externa sempre volta a penetrar por esse mesmo ponto de submissão verbal.", "Dependência emocional": "A fala da pessoa dependente emocionalmente não vem de um lugar soberano, mas de uma necessidade de manter vínculos a qualquer custo. Ela não consegue se posicionar, tem medo de dizer o que sente, e com isso deixa seu campo desprotegido. O chakra laríngeo, quando usado para manter laços disfuncionais, se torna um canal de entrada para energias densas. A limpeza vibracional precisa passar por esse reconhecimento.", "Falta de autorregulação": "Sem autorregulação, a comunicação se torna impulsiva ou desorganizada. A pessoa fala demais ou se cala completamente. Não há filtro, nem consciência sobre o impacto do que se diz ou se cala. Essa instabilidade vibracional cria rachaduras no campo laríngeo, que não consegue exercer sua função de sustentação. O campo fica exposto e desordenado, e a limpeza se torna ineficaz se a escuta interna não for restaurada.", "Vínculos abertos": "O chakra laríngeo, ao ser envolvido em vínculos que nunca se encerram verbalmente, permanece como uma linha energética ativa, sustentando trocas que já deveriam ter sido liberadas. Palavras que nunca foram ditas, promessas que ainda vibram, ressentimentos não expressos: tudo isso se torna cordões abertos que drenam o campo. A limpeza precisa incluir a expressão consciente e o fechamento energético desses vínculos para que a proteção possa se restaurar.", "Culpa": "A culpa age no laríngeo como um silenciador. A pessoa acredita que não tem direito de se expressar, que não pode dizer o que pensa ou sente. Fica muda, engole palavras, e com isso enfraquece a vibração da própria voz. Esse enfraquecimento abre espaço para que energias externas invadam seu campo. A limpeza exige libertação dessa culpa vibracional e o resgate da expressão verdadeira como ferramenta de proteção."}}, "Frontal": {"Rígido": {"Rejeição ou abandono": "A dor emocional de não ter sido vista ou compreendida leva a pessoa a fechar a visão interna. Para não sentir a repetição da rejeição, ela endurece sua intuição e evita acessar suas percepções mais profundas. Isso gera uma falsa proteção: o campo parece fechado, mas está apenas desconectado. A limpeza precisa remover as camadas de defesa emocional que nublam a visão, e a proteção verdadeira só se sustenta com reconexão ao sentir.", "Ressentimento ou mágoas não liberadas": "Mágoas antigas distorcem a percepção presente. A pessoa vê através do filtro do passado e desconfia de tudo o que chega. O chakra frontal se torna um centro de julgamento, e não de clareza. Isso contamina o campo com pensamentos recorrentes e formas-pensamento cristalizadas. A limpeza ajuda a dissolver essas cristalizações mentais e emocionais, liberando espaço para que a verdadeira visão retorne. A proteção aqui é fruto do perdão que libera a mente para ver o agora.", "Medo de intimidade": "A intimidade emocional exige ver o outro como ele é, mas também ver a si mesma com honestidade. Quem teme essa proximidade muitas vezes fecha o terceiro olho como forma de não enxergar o que não está pronta para acolher. Isso cria uma barreira sutil, onde a percepção se torna seletiva e, por isso, frágil. A limpeza nesse caso precisa abrir espaço para a verdade emocional, e a proteção virá com a coragem de se ver e se mostrar por inteiro.", "Traumas de abuso, controle ou manipulação": "Situações em que a verdade foi distorcida ou negada causam danos profundos ao chakra frontal. A pessoa pode ter medo de confiar em sua própria visão, duvidar de suas percepções ou rejeitar qualquer intuição que vá contra o que foi ensinado. Isso abre o campo para que outras vozes, externas ou espirituais, se imponham. A limpeza precisa restaurar o direito de ver com os próprios olhos. A verdadeira proteção será a reconquista da lucidez espiritual.", "Necessidade de manter o controle emocional": "Para evitar se sentir vulnerável, a pessoa tenta antecipar tudo, prever tudo, entender tudo. O terceiro olho se torna hiperativo, mas não intuitivo. A mente cria cenários, interpreta sinais com excesso de análise e se desconecta da escuta sensível. Essa vigilância constante enfraquece o campo e o torna rígido, não protegido. A limpeza permite que a pessoa desative esse controle ilusório e volte a confiar em sua presença. A proteção nasce da entrega consciente, não do controle mental."}, "Solto": {"Carência afetiva": "A carência cria uma busca constante por validação externa. Nesse movimento, a pessoa tende a idealizar o outro e perde a capacidade de enxergar com clareza. O chakra frontal fica vulnerável à projeção, e a visão interna é distorcida por desejos não reconhecidos. O campo se abre para influências externas, pois a intuição é substituída por expectativas emocionais. A limpeza precisa dissolver as ilusões criadas pela falta, e a proteção será sustentada quando a pessoa puder se nutrir com sua própria presença.", "Rejeição ou abandono": "Diferente da rigidez, aqui a rejeição leva à entrega sem filtro. A pessoa deseja tanto ser aceita que ignora seus sinais internos. Ela vê o que quer ver, não o que realmente é. Esse tipo de brecha energética atrai relações desequilibradas e conexões espirituais confusas. A limpeza ajuda a liberar a identificação com o abandono e a reorganizar o centro de visão. A proteção virá quando a visão deixar de ser carente e puder se tornar consciente.", "Dependência emocional": "Quando há dependência, o chakra frontal se alinha ao outro em vez de à própria essência. A pessoa não enxerga com clareza porque sua visão está voltada para agradar, atender, manter a conexão a qualquer custo. Essa abertura exagerada torna o campo facilmente influenciável, e a percepção se torna confusa. A limpeza permite que o centro de visão seja recentrado, e a proteção será possível quando a pessoa reconquistar a autonomia de enxergar por si mesma.", "Falta de autorregulação": "Sem autorregulação emocional, a percepção se torna reativa. Pequenos estímulos geram grandes reações internas, e o chakra frontal se sobrecarrega. A pessoa confunde intuição com medo, sensibilidade com alarme. Isso deixa o campo instável, sujeito a oscilações e aberturas indesejadas. A limpeza ajuda a restaurar o silêncio interno necessário para a visão clara. A proteção virá quando a pessoa aprender a regular suas emoções sem se desconectar de si.", "Vínculos abertos": "Vínculos mal resolvidos ou não encerrados mantêm o chakra frontal preso a imagens do passado. A visão se volta para trás, e o presente se torna enevoado. A pessoa pode sentir presenças, interferências ou confusões mentais que parecem vir de fora, mas que são reflexos dessas conexões não encerradas. A limpeza desfaz esses fios invisíveis e libera a visão para o agora. A proteção se estabelece quando os olhos internos se voltam para o que está vivo, e não para o que ficou.", "Culpa": "A culpa distorce a forma como a pessoa interpreta tudo o que vê. Ela se torna hipervigilante, sempre esperando errar, sempre se sentindo julgada. Essa distorção abre o campo para manipulação emocional, obsessões espirituais ou confusão entre o que é intuição e o que é autocondenação. A limpeza ajuda a dissolver a culpa e devolver o olhar amoroso para si. A proteção virá da lucidez de quem sabe que pode ver com verdade, sem se condenar."}}, "Coronário": {"Rígido": {"Rejeição ou abandono": "A dor profunda de se sentir rejeitada pela própria espiritualidade pode levar a um fechamento completo do chakra coronário. A pessoa acredita que está sozinha no mundo, desconectada de qualquer amor maior. Esse tipo de bloqueio emocional gera rigidez e ceticismo espiritual, criando um campo fechado que resiste à luz e ao amparo sutil. A limpeza nesse caso remove mágoas antigas relacionadas à fé e a proteção se restaura à medida que a confiança é reconstruída internamente.", "Ressentimento ou mágoas não liberadas": "Feridas emocionais com a vida, com Deus ou com caminhos espirituais anteriores podem gerar ressentimento profundo, bloqueando a abertura do chakra coronário. A pessoa se desconecta do fluxo divino por mágoa, acreditando que foi injustiçada ou abandonada pela própria espiritualidade. Esse ressentimento cria uma barreira energética que impede o fluxo superior e enfraquece a proteção natural do campo. A limpeza dissolve essa carga emocional e a proteção se instala quando há entrega consciente e abertura à cura.", "Medo de intimidade": "No nível mais sutil, o medo de intimidade se manifesta como receio de se fundir ao Todo. A pessoa teme perder o controle, teme ser absorvida ou aniquilada ao se conectar com o divino. Esse medo bloqueia o chakra coronário e restringe a experiência espiritual. O campo se mantém rígido, preso à mente, evitando experiências expansivas. A limpeza ajuda a liberar esse medo ancestral e a proteção acontece quando há confiança para se abrir ao que transcende, sem perder a identidade.", "Traumas de abuso, controle ou manipulação": "Experiências espirituais traumáticas, como doutrinas rígidas, manipulações religiosas ou rituais desrespeitosos podem deixar marcas profundas no chakra coronário. A pessoa fecha seu campo como forma de autoproteção, mas também se desconecta da fonte. A rigidez se instala como defesa contra qualquer forma de espiritualidade. A limpeza é essencial para liberar essas memórias e permitir que a espiritualidade volte a ser um espaço de amor e verdade. A proteção se estabelece quando há discernimento para escolher quais fontes acessar.", "Necessidade de manter o controle emocional": "O desejo de controlar tudo mental e emocionalmente impede a rendição espiritual. A pessoa desconfia do invisível, rejeita o mistério e bloqueia as experiências que não consegue racionalizar. Esse controle cria rigidez no chakra coronário, impedindo a circulação vibracional e tornando o campo vulnerável à estagnação. A limpeza convida à entrega e à humildade diante da sabedoria maior. A verdadeira proteção nasce da confiança no fluxo da vida e na presença amorosa do Todo."}, "Solto": {"Carência afetiva": "Quando a carência afetiva se desloca para o campo espiritual, a pessoa busca em experiências místicas ou conexões sutis uma forma de suprir o vazio emocional. Isso abre excessivamente o chakra coronário, tornando o campo vulnerável a ilusões, fantasias espirituais ou dependência de figuras elevadas. A proteção se rompe porque há uma entrega sem discernimento. A limpeza aqui precisa restaurar o eixo emocional e a proteção se reconstrói com o enraizamento da presença no corpo e na realidade.", "Rejeição ou abandono": "A sensação de ter sido abandonada pela espiritualidade pode levar a um estado de desorientação emocional. A pessoa abre demais seu campo tentando sentir algo, procurando sinais ou pertencimento em qualquer lugar. Isso enfraquece o discernimento e permite que energias desequilibradas se instalem. A limpeza ajuda a libertar essa dor, enquanto a proteção se estabelece quando a conexão espiritual volta a ser vivida como algo interno e amoroso, não como busca de validação.", "Dependência emocional": "Nesse chakra, a dependência se manifesta como apego a mestres, técnicas ou promessas espirituais. A pessoa transfere seu centro de poder para fora de si, acreditando que precisa de algo ou alguém para se conectar ao divino. Esse padrão abre brechas no campo e permite interferências. A limpeza dissolve os vínculos criados a partir da carência e a proteção se solidifica quando há retomada da autonomia espiritual e da escuta interior.", "Falta de autorregulação": "A dificuldade de sustentar estados de presença e equilíbrio emocional faz com que o chakra coronário oscile entre abertura extrema e fechamento abrupto. A pessoa pode experimentar confusão, exaustão, desconexão ou absorção de energias externas. A limpeza organiza esses fluxos e a proteção acontece quando há integração entre espiritualidade e corpo, entre consciência elevada e cotidiano.", "Vínculos abertos": "Laços energéticos mantidos com práticas espirituais antigas, grupos, crenças ou pactos podem manter o chakra coronário exposto. Mesmo sem perceber, a pessoa continua vibrando em conexões que já não fazem sentido para sua evolução. Esses vínculos drenam sua energia e abrem portas para influências. A limpeza atua desfazendo essas amarras e a proteção se consolida com escolhas conscientes, alinhadas à verdade do momento presente.", "Culpa": "A culpa espiritual, muitas vezes inconsciente, faz com que a pessoa se sinta indigna de se conectar ao sagrado. Essa culpa abre o campo a experiências distorcidas e a relacionamentos espirituais baseados em punição ou medo. O chakra coronário se torna um ponto vulnerável. A limpeza libera esse sentimento de inadequação e a verdadeira proteção surge quando a pessoa reconhece sua luz e sua conexão intrínseca com o divino."}}}, "Mental": {"Básico": {"Rígido": {"Autossuficiência": "A cliente acredita que não precisa de ninguém. Essa crença é construída como um mecanismo de defesa, geralmente a partir de vivências de rejeição, abandono ou decepções profundas. O pensamento de que pode dar conta de tudo sozinha a distancia dos outros e a impede de receber apoio. Isso endurece o campo mental e isola sua energia, tornando-a resistente ao fluxo natural da vida e da cura.", "Controle seguro": "A mente associa segurança ao controle. A cliente sente que precisa estar no comando de tudo, prever todas as variáveis, garantir que nada fuja do que ela considera aceitável. Essa postura mental cria tensão constante, bloqueando a espontaneidade e deixando o campo em alerta. O chakra básico perde sua força de sustentação natural, pois está sobrecarregado pela tentativa de controle.", "Rigidez": "A pessoa desenvolve ideias fixas sobre como o mundo deve funcionar, como ela deve ser e como os outros devem se comportar. Essa rigidez mental dificulta o acolhimento de novas percepções e impede ajustes saudáveis na realidade. Quando algo desafia suas estruturas, ela reage com resistência. Essa inflexibilidade gera tensão no campo energético e contribui para o fechamento vibracional do chakra básico.", "Perfeccionismo e autoexigência": "A mente acredita que precisa acertar sempre, que qualquer falha pode ser motivo de rejeição. A cliente cria um padrão mental de exigência excessiva, tanto consigo quanto com os outros. Esse ideal de perfeição mantém o campo em constante tensão, impedindo o descanso vibracional e alimentando a autocobrança. O chakra básico fica sobrecarregado e incapaz de sustentar a energia com leveza.", "Forte e racional": "A cliente assume o papel de quem precisa ser sempre forte, lógica e emocionalmente controlada. As emoções são descartadas ou minimizadas, como se sentir fosse um sinal de fraqueza. O racional domina, criando uma camada mental densa que bloqueia o contato consigo mesma. O campo se fecha para o fluxo emocional e o chakra básico enfraquece por falta de conexão com as sensações reais do corpo."}, "Solto": {"Agradadora": "A mente da cliente está condicionada a buscar aceitação a qualquer custo. Ela acredita que, para ser amada ou reconhecida, precisa agradar, ceder, concordar. Isso rompe seu senso de limite mental. Mesmo quando sente que algo está errado, ela não consegue sustentar um não. O campo se abre pela tentativa constante de corresponder às expectativas alheias, o que a torna vulnerável a manipulações, sobrecarga e perda de energia.", "Sem identidade": "A falta de presença no próprio corpo se traduz em uma ausência de identidade clara. A cliente sente dificuldade de saber o que pensa ou sente, especialmente diante de outras pessoas. Sua referência está sempre no externo. Isso gera um campo energético permeável, onde qualquer influência externa pode ocupar espaço. O limite não é rompido apenas pelo outro, mas pela própria desorganização interna, que impede a definição de quem ela é.", "Anulação": "A mente cria justificativas para se calar, recuar, não se impor. Existe uma tendência a se anular como forma de evitar conflito ou manter uma falsa harmonia. A cliente pode pensar que está sendo espiritualizada, empática ou evoluída, quando na verdade está abrindo mão de si. Essa ausência de posicionamento cria aberturas no campo que enfraquecem sua vitalidade e geram sensações de esgotamento, confusão e desânimo.", "Submissão": "Há uma programação mental de obediência, como se a cliente precisasse se submeter a figuras de autoridade ou vínculos que impõem regras, mesmo que injustas. A mente teme desagradar, teme ser punida. Com isso, ela entrega seu poder pessoal e permite que os outros ultrapassem seus limites mentais. O chakra básico, já enfraquecido, deixa de sustentar a força necessária para o posicionamento energético.", "Salvadora": "A cliente acredita que é sua responsabilidade ajudar, sustentar, resolver os problemas dos outros, mesmo que isso custe seu equilíbrio. A mente associa amor com sacrifício. O campo mental cria justificativas para a doação sem medida, o que abre brechas energéticas constantes. O chakra básico não consegue reter energia vital suficiente para si, pois há uma entrega contínua às necessidades alheias, sem discernimento."}}, "Sacral": {"Rígido": {"Autossuficiência": "A mente acredita que é mais seguro depender apenas de si mesma. A cliente assume uma postura de independência extrema, negando suas necessidades afetivas e emocionais. Esse fechamento impede a nutrição por trocas saudáveis e enfraquece a abertura do chakra sacral para a vida e para o prazer. O campo se torna seco, desconectado e vulnerável a rigidez vibracional, pois não há fluxo de recebimento.", "Controle seguro": "A cliente tenta manter sob controle tudo o que envolve afeto, prazer e sexualidade. Controla os vínculos, os sentimentos, os desejos. A rigidez mental sustenta um campo aparentemente organizado, mas internamente tenso e frágil. Essa tentativa de segurança absoluta bloqueia o fluxo do chakra sacral e enfraquece sua proteção natural, pois a energia se torna artificialmente contida.", "Rigidez": "A cliente tem crenças fixas sobre o que é certo ou errado nas relações, nos desejos, na forma de se vincular. Julga os próprios impulsos e os do outro. Esse moralismo mental cria uma couraça vibracional que impede a fluidez. A limpeza se torna difícil, pois a energia estagna. A proteção, nesse caso, é uma rigidez que não permite transformação.", "Perfeccionismo e autoexigência": "A mente exige da cliente uma performance ideal também nos vínculos afetivos. Ela sente que precisa ser perfeita para merecer amor, prazer ou acolhimento. Essa pressão mental gera culpa, repressão e distanciamento do corpo. O chakra sacral entra em estado de tensão constante, abrindo brechas no campo energético por exaustão vibracional.", "Forte e racional": "A cliente racionaliza tudo o que sente. Mantém um discurso de força e estabilidade, mesmo quando está emocionalmente abalada. O pensamento assume o controle da sensibilidade, e o corpo deixa de ser escutado. Esse distanciamento gera dissociação energética. O chakra sacral se enfraquece porque a mente não permite que ele vibre em sua frequência natural de prazer, nutrição e vínculo. A proteção aqui é uma ilusão mental, que não sustenta o campo diante de experiências mais intensas."}, "Solto": {"Agradadora": "A cliente acredita que precisa agradar para ser aceita nas relações. Sua mente a convence de que ceder, sorrir, cativar ou se moldar ao outro é a forma de manter um vínculo. Esse padrão mental fragiliza o chakra sacral, pois a troca deixa de ser genuína e passa a ser condicionada. O campo energético se abre em excesso, buscando aprovação e deixando de proteger a integridade do próprio prazer.", "Sem identidade": "Há uma dissolução do senso de eu. A cliente se adapta tanto às expectativas externas que perde contato com sua essência. A mente não sabe mais quem ela é, o que deseja ou o que sente. Tudo se confunde. O chakra sacral, que deveria sustentar autenticidade nas relações e nos desejos, se desorganiza. O campo se torna vulnerável a interferências, pois não há clareza interna que sustente uma proteção vibracional verdadeira.", "Anulação": "A cliente aprendeu a calar seus desejos, suas vontades e até seus limites. A mente acredita que não é seguro expressar quem se é, e por isso a anulação parece a melhor forma de sobrevivência. Esse autoabandono compromete profundamente a vibração do chakra sacral, que se torna opaco, sem vitalidade e extremamente vulnerável a ocupações energéticas externas.", "Submissão": "A mente sustenta padrões herdados ou aprendidos de obediência cega. A cliente sente que não pode se posicionar, dizer não ou reivindicar o próprio espaço. Essa submissão cria brechas profundas no campo, pois o chakra sacral precisa de liberdade para se expressar, sentir e escolher. Quando isso é negado, o campo se abre para repetições dolorosas e vínculos drenantes.", "Salvadora": "A cliente se vê mentalmente responsável por curar, ajudar ou salvar os outros, mesmo quando isso exige o sacrifício de si. A mente justifica a doação excessiva como missão ou empatia, mas na verdade ela está ultrapassando todos os próprios limites. O chakra sacral perde energia vital, pois ao doar sem medida, não há espaço para repor ou receber. A proteção energética se rompe pela sobrecarga."}}, "Plexo Solar": {"Rígido": {"Autossuficiência": "A cliente criou um sistema de proteção baseado na crença de que não pode depender de ninguém. Assume tudo sozinha, evita pedir ajuda e se recusa a mostrar vulnerabilidade. Essa postura endurece o plexo solar, gerando uma defesa constante que a desconecta de trocas nutritivas. Por trás da autossuficiência, há medo de ser ferida ou rejeitada, e o campo acaba isolado, sem permissão para receber suporte energético real.", "Controle seguro": "A mente acredita que, se ela não controlar tudo ao redor, algo ruim pode acontecer. A cliente vive em alerta, tenta prever todas as variáveis, corrige, interfere e antecipa. Isso aprisiona o plexo solar em um estado de hiperatividade, impedindo o fluxo natural da energia. O campo se torna rígido, bloqueando tanto invasões quanto movimentos legítimos de expansão. Essa forma de controle cria exaustão e enfraquece a proteção verdadeira, que só nasce do equilíbrio.", "Rigidez": "Convicções mentais fixas sobre o que é certo e errado, seguro ou perigoso, criam uma estrutura inflexível. A cliente estabelece limites duros, muitas vezes desproporcionais, por medo de se perder ou se machucar. Essa rigidez impede a circulação da energia no plexo solar, gerando tensão, conflitos e isolamento. O campo não se adapta, não se ajusta e não reconhece quando algo já não representa mais ameaça. A proteção vira muro, e o muro adoece.", "Perfeccionismo e autoexigência": "A mente exige padrões elevados, cobra desempenho, espera resultados impecáveis. A cliente coloca sobre si o peso de nunca falhar e de sempre corresponder. Isso bloqueia o plexo solar, que se sobrecarrega tentando sustentar uma imagem de força ou excelência. A energia não flui com leveza, porque está sempre sendo avaliada. A proteção falha, pois o campo se mantém aberto à crítica, ao julgamento e à constante comparação.", "Forte e racional": "A cliente se recusa a sentir. Utiliza o raciocínio como estratégia para não acessar suas emoções. Justifica tudo, analisa tudo, explica tudo. Essa postura aparentemente forte desconecta a mente do corpo, e o plexo solar perde a referência interna. O campo se torna vulnerável por dentro, mesmo que pareça seguro por fora. A verdadeira proteção energética exige conexão com a essência, e não apenas defesa mental."}, "Solto": {"Agradadora": "A cliente se molda mentalmente para agradar os outros. Não sustenta suas opiniões, muda de ideia com facilidade e teme ser rejeitada ao discordar. A mente prioriza a aceitação externa e evita conflitos a qualquer custo. Com isso, o plexo solar perde força de posicionamento e o campo energético fica exposto, absorvendo críticas, exigências ou comandos que não deveriam ser internalizados. A proteção falha porque os pensamentos estão voltados para fora, e não para a própria verdade.", "Sem identidade": "A cliente tem dificuldade de saber o que pensa, sente ou deseja. Suas ideias se misturam com as dos outros, e ela não sustenta uma direção clara. Essa falta de referência interna desorganiza o plexo solar, gerando um campo mental permeável, onde tudo entra e nada é filtrado. A energia se confunde, os limites se diluem e a proteção desaparece. Quando não há clareza de quem se é, qualquer pensamento externo pode se instalar.", "Anulação": "A mente da cliente aprendeu a se calar, a ceder, a não confrontar. Ela se anula para evitar conflito, apaga sua força para manter a harmonia. Essa postura reprime o fluxo do plexo solar, que deveria sustentar o senso de poder pessoal. O campo energético fica vulnerável, pois não há movimento de afirmação. A proteção só é possível quando há presença interna, e a anulação impede esse enraizamento.", "Submissão": "A cliente foi condicionada a obedecer, seguir ordens, aceitar estruturas mentais externas sem questionar. Sua mente acredita que não pode contrariar, que precisa seguir regras para ser aceita ou estar segura. Essa submissão distorce o plexo solar, que perde sua função de comando interno. O campo fica desprotegido, pois qualquer ideia externa pode dominar a energia pessoal. Sem soberania mental, não há contenção vibracional.", "Salvadora": "A cliente acredita que precisa resolver tudo para todos. Sua mente assume responsabilidades que não são suas e tenta salvar, ajudar ou consertar os outros. Essa dinâmica esgota o plexo solar, pois a energia está constantemente sendo enviada para fora. O campo se abre em excesso, permitindo que dores, padrões ou pensamentos alheios se instalem. A proteção energética se enfraquece quando a mente deixa de reconhecer os próprios limites e assume um papel que ultrapassa sua função."}}, "Cardíaco": {"Rígido": {"Autossuficiência": "Quando a mente assume que não precisa de ninguém, o chakra cardíaco se fecha. A pessoa constrói uma fortaleza racional em torno dos sentimentos, impedindo que a energia do afeto circule livremente. Essa barreira mental, embora pareça proteção, na verdade desconecta a pessoa de trocas verdadeiras e a isola energeticamente. A limpeza se torna limitada, pois não há abertura para deixar ir. A proteção se endurece e perde flexibilidade.", "Controle seguro": "A mente acredita que controlar emoções, pessoas e situações é a única forma de não se machucar. Esse controle excessivo aprisiona o chakra cardíaco, impedindo que a energia flua com leveza. Tudo precisa ser previsto, compreendido, explicado. Essa rigidez mental gera um campo pesado, que repele a espontaneidade e dificulta a liberação vibracional. A falsa sensação de segurança impede a entrega necessária para a real proteção.", "Rigidez": "O chakra cardíaco, quando afetado por pensamentos rígidos, torna-se incapaz de se abrir ao novo. A pessoa desenvolve regras internas para amar, para confiar, para se permitir. Essa rigidez gera julgamentos, moralismos e expectativas que contaminam o campo. Ao invés de proteção, cria-se afastamento. E ao invés de limpeza, reforça-se o acúmulo de padrões cristalizados.", "Perfeccionismo e autoexigência": "A exigência de estar sempre certa, sempre forte, sempre no controle, leva a mente a reprimir emoções legítimas. O chakra se fecha para não mostrar imperfeições. Esse fechamento mental bloqueia os canais de liberação energética, tornando difícil dissolver dores antigas ou expressar vulnerabilidades. A proteção deixa de ser um campo de presença e vira um escudo que sufoca.", "Forte e racional": "Assumir o papel de fortaleza pode parecer proteção, mas muitas vezes é desconexão. A mente que se mantém apenas na racionalidade, sem espaço para o sentir, impede a circulação energética do chakra cardíaco. O campo fica árido, sem ressonância afetiva, e por isso mais exposto a interferências. A verdadeira proteção nasce da integração, e não da separação entre razão e emoção."}, "Solto": {"Agradadora": "A mente que acredita que precisa agradar a todos para ser aceita deixa o chakra cardíaco excessivamente aberto. Essa abertura sem discernimento enfraquece a proteção energética, pois a pessoa não consegue dizer não, se posicionar ou sustentar sua verdade. Em vez de selecionar o que entra e o que sai, tudo é absorvido. Isso gera acúmulo de energias externas e sobrecarga emocional, dificultando os processos de limpeza vibracional.", "Sem identidade": "Quando a pessoa não tem clareza de quem é, o campo mental se mistura com o do outro com facilidade. O chakra cardíaco, nesse caso, tenta compensar a ausência de identidade com uma abertura desmedida ao mundo externo. Não há critério energético, e isso cria um campo altamente vulnerável a influências, formas-pensamento e confusões relacionais. A proteção falha porque não existe um centro firme de onde sustentar limites conscientes.", "Anulação": "A mente que se anulou ao longo da vida aprende a se calar, a se esconder e a não ocupar espaço. O chakra cardíaco se retrai, mas não por proteção: por medo. Essa retração impede tanto a expressão quanto a recepção do amor verdadeiro, e o campo se torna um lugar de silêncio interno e desconexão. A limpeza se torna difícil, pois há resistência em acessar as próprias dores. E a proteção se fragiliza, pois não há presença vibracional ativa.", "Submissão": "Quando a mente associa amor com obediência, o campo se curva a dinâmicas que ferem. O chakra cardíaco aceita interferências, manipulações e relações abusivas como parte do pacote afetivo. Essa submissão mina a força vibracional necessária para estabelecer limites claros. O campo se torna um receptáculo passivo de energias densas, e a limpeza só se torna possível quando essa estrutura mental começa a se dissolver.", "Salvadora": "A ideia de que precisa salvar todos leva a mente a assumir para si dores e problemas alheios. O chakra cardíaco, nesse padrão, vive em alerta constante, tentando oferecer mais do que pode. Essa doação compulsiva suga a energia vital, enfraquece a proteção e impede o repouso necessário para que o campo se reorganize. A limpeza se torna repetitiva e pouco eficaz, pois há um retorno inconsciente ao padrão de carregar o que não é seu."}}, "Laríngeo": {"Rígido": {"Autossuficiência": "Quando o chakra laríngeo é atravessado por uma crença rígida de autossuficiência, a pessoa se recusa a pedir ajuda ou compartilhar suas dores. Usa a fala como instrumento de controle, não como ponte de conexão. A comunicação se torna unilateral, impenetrável. Isso cria uma blindagem mental que não protege de fato, apenas isola. A limpeza vibracional não consegue atingir camadas mais profundas, pois a mente bloqueia qualquer possibilidade de entrega. A proteção, aqui, é baseada na defesa mental, não na verdade vibracional.", "Controle seguro": "A necessidade de controlar tudo o que é dito e como é dito transforma a comunicação em um campo tenso. A pessoa mede palavras, evita espontaneidade, calcula cada fala para não ser invadida ou exposta. Esse esforço mental constante impede o fluxo natural do chakra laríngeo e enfraquece a presença. A proteção é apenas uma ilusão de comando. A mente acredita que está em segurança, mas o campo vibra rigidez e desconexão, tornando-se frágil diante de influências externas.", "Rigidez": "Ideias fixas sobre o que é certo ou errado no falar criam barreiras mentais que travam a expressão do ser. A pessoa se prende a padrões antigos, dogmas ou narrativas herdadas, e não permite que sua voz seja canal da própria essência. Isso gera estagnação no chakra laríngeo e impede que a limpeza energética alcance as informações distorcidas que precisam ser liberadas. A rigidez mental, nesse ponto, impede o campo de se reorganizar por completo.", "Perfeccionismo e autoexigência": "A fala precisa ser perfeita, bonita, aceita. A mente impõe um padrão tão alto à expressão que a pessoa passa a se censurar antes mesmo de tentar dizer algo. Isso cria bloqueios profundos no chakra laríngeo e abre espaço para autocrítica excessiva, vergonha e retração. O campo, fragilizado por essa pressão interna, não consegue sustentar uma vibração de proteção real. A limpeza precisa dissolver o padrão mental de cobrança e abrir espaço para a expressão genuína.", "Forte e racional": "Neste padrão, a pessoa utiliza a razão para justificar tudo o que diz. Evita vulnerabilidade, se esconde atrás de argumentos, e transforma a fala em mecanismo de defesa. Não se permite ser vista em profundidade, usa a mente para manter o distanciamento. Isso gera um campo mental denso ao redor do chakra laríngeo, que impede o fluxo natural da energia. A proteção se torna uma fortaleza vazia, e a limpeza, limitada pela recusa da mente em se abrir ao sentir."}, "Solto": {"Agradadora": "A mente busca aceitação por meio da fala. A pessoa diz o que o outro quer ouvir, omite o que pensa, suaviza verdades para não desagradar. O chakra laríngeo fica sobrecarregado por discursos que não traduzem a essência. Esse campo de concessão constante torna a pessoa vulnerável a manipulações, julgamentos e energias externas. A limpeza precisa romper com o padrão de agradar para existir. A verdadeira proteção começa quando a expressão se alinha à alma, não à expectativa alheia.", "Sem identidade": "A comunicação se molda ao ambiente. A pessoa fala de um jeito com cada um, sem consistência. Não sustenta a própria verdade, pois não sabe ao certo o que pensa, sente ou acredita. O chakra laríngeo vibra confusão e imprecisão, dificultando qualquer alinhamento energético. Sem identidade verbal, o campo se abre para interferências que dominam a narrativa interna. A limpeza nesse caso exige um mergulho na escuta de si, e a proteção só é possível com enraizamento vibracional da própria voz.", "Anulação": "A mente acredita que sua opinião não importa. Prefere o silêncio por medo de errar, ser ridicularizada ou rejeitada. O chakra laríngeo se fecha não por escolha consciente, mas por medo inconsciente. A pessoa perde espaço energético nas relações, tornando-se invisível em seu próprio campo. Essa ausência abre brechas que drenam vitalidade. A limpeza precisa restaurar o direito de ocupar a própria palavra. A proteção vem da presença que se permite existir.", "Submissão": "A fala é sempre passiva, condicionada à autoridade externa. A mente associa verdade à voz do outro. Quando o chakra laríngeo está marcado por submissão, a pessoa silencia sua percepção em nome de uma obediência mental. Isso a torna altamente influenciável por campos externos, crenças coletivas ou manipulações espirituais. A limpeza deve restaurar o discernimento e a soberania da expressão. A proteção nasce quando a mente se liberta da hierarquia imposta e se abre à sabedoria interna.", "Salvadora": "A mente acredita que precisa sempre orientar, ajudar, ensinar. Usa a fala como forma de cuidar do outro, mesmo sem ser solicitada. O chakra laríngeo vibra excesso de emissão, mas pouca escuta. Isso desgasta o campo e abre espaço para absorver cargas emocionais alheias. A limpeza precisa reorganizar o lugar da palavra: não como ferramenta de controle disfarçada de apoio, mas como canal de presença. A verdadeira proteção se estabelece quando a expressão é sustentada por permissão e consciência."}}, "Frontal": {"Rígido": {"Autossuficiência": "A crença de que não preciso de ninguém cria um isolamento intelectual que bloqueia a visão intuitiva. O chakra frontal, que deveria ser um canal para o novo, se fecha em certezas rígidas. A pessoa se torna cética em excesso, desconectada da sensibilidade espiritual, acreditando apenas no que pode controlar ou comprovar. Essa rigidez limita a percepção vibracional e enfraquece o campo, pois tudo o que não é racional é automaticamente rejeitado. A limpeza precisa liberar essa prisão mental e permitir que a visão interna volte a se abrir com confiança. A proteção nasce da humildade de não saber tudo e da disposição de ver além do visível.", "Controle seguro": "A necessidade de controlar o que vê, prevê ou compreende gera tensão constante no chakra frontal. A pessoa busca interpretar e antecipar tudo, mas essa vigilância mental impede a verdadeira visão. O campo se torna denso, confuso e cheio de resistência ao inesperado. A limpeza dissolve esse excesso de controle, abrindo espaço para a lucidez e a leveza. A proteção se sustenta quando a mente aprende a confiar no invisível sem tentar dominá-lo.", "Rigidez": "Pensamentos fixos, crenças absolutas e interpretações imutáveis bloqueiam o fluxo natural da percepção. O chakra frontal, que deveria ser um canal de insight e expansão, se torna uma lente embaçada pela rigidez. Essa postura fecha o campo para possibilidades novas, dificulta a escuta interna e cria uma proteção ilusória baseada em negação. A verdadeira limpeza vem da flexibilização dos pensamentos. A verdadeira proteção, da disposição de ver diferente.", "Perfeccionismo e autoexigência": "A exigência por sempre acertar impede a visão espontânea e bloqueia a sensibilidade psíquica. A pessoa acredita que precisa entender tudo perfeitamente para confiar em si, o que gera tensão e autocobrança no campo mental. O chakra frontal, ao invés de canal de recepção, se torna um filtro crítico que invalida as percepções sutis. A limpeza dissolve o excesso de julgamento interno, e a proteção se torna possível quando há permissão para ver com leveza, sem precisar ser perfeita.", "Forte e racional": "O uso excessivo da razão como proteção emocional leva ao distanciamento da intuição. A pessoa usa o raciocínio para justificar tudo o que sente, sem realmente sentir. Essa desconexão fecha o chakra frontal para o sutil, mesmo que a pessoa tenha conhecimento espiritual. O campo se torna vulnerável por falta de verdade interna. A limpeza ajuda a dissolver a máscara racional e reconectar o olhar ao coração. A proteção nasce da coerência entre o que se vê e o que se sente."}, "Solto": {"Agradadora": "A pessoa abre mão da própria visão para ser aceita. Ela invalida suas percepções, ignora seus pressentimentos e adota o ponto de vista do outro para não desagradar. O chakra frontal perde força porque deixa de ser canal de verdade interior e passa a ser moldado pela necessidade de validação externa. Isso enfraquece o campo, pois a mente se confunde e não sabe mais no que acreditar. A limpeza traz de volta a clareza interna, e a proteção começa quando a pessoa confia no que vê, mesmo que os outros não vejam igual.", "Sem identidade": "A ausência de um eixo mental claro gera confusão nas ideias, dificuldade de discernimento e vulnerabilidade a influências externas. A pessoa tem dificuldade de manter a própria visão e se perde em informações, opiniões e crenças alheias. O chakra frontal se sobrecarrega, tentando processar tudo sem filtro, o que abre brechas no campo. A limpeza reorganiza os pensamentos dispersos e a proteção só é possível quando a pessoa se reconhece como centro do próprio olhar.", "Anulação": "A mente se anula para manter a paz, evitar conflitos ou sustentar relacionamentos. A pessoa não expressa suas opiniões, mesmo quando vê com clareza. O chakra frontal se fecha parcialmente, criando um campo opaco e silencioso, onde a visão está presente, mas é ignorada. Essa negação enfraquece a proteção natural do campo. A limpeza ajuda a validar a visão interna, e a proteção se estabelece quando a pessoa se autoriza a pensar com firmeza e expressar sua verdade.", "Submissão": "A mente foi condicionada a obedecer sem questionar. A pessoa acredita que não pode ver diferente, que precisa aceitar o que lhe é imposto, mesmo que algo dentro dela perceba o contrário. O chakra frontal, ao invés de canal de lucidez, torna-se uma zona de confusão e silêncio. O campo se torna vulnerável porque a percepção é suprimida. A limpeza rompe esses pactos inconscientes e a proteção nasce da coragem de sustentar o próprio ponto de vista, mesmo diante de figuras de autoridade.", "Salvadora": "A mente assume o papel de resolver tudo para todos, acreditando que enxerga o que o outro não vê e que deve intervir. Essa postura, muitas vezes inconsciente, cria uma hiperatividade no chakra frontal e uma invasão vibracional do campo alheio. A pessoa se desconecta da própria visão para tentar guiar a dos outros. O campo perde coerência e se torna vulnerável por excesso de dispersão. A limpeza devolve a pessoa ao seu próprio centro, e a proteção acontece quando ela reconhece que cada um tem seu tempo e sua visão."}}, "Coronário": {"Rígido": {"Autossuficiência": "Quando a mente acredita que pode conduzir sua espiritualidade sozinha, sem entrega ou escuta, o chakra coronário se fecha em uma falsa proteção. A autossuficiência nesse campo não é liberdade, mas negação da conexão profunda com algo maior. Esse fechamento cria uma rigidez que impede a renovação vibracional e a recepção de orientações sutis. A limpeza ajuda a dissolver o orgulho espiritual e a proteção verdadeira acontece quando a pessoa reconhece que não precisa controlar a espiritualidade, mas sim se abrir com consciência para ela.", "Controle seguro": "A tentativa de controlar o invisível, compreender tudo racionalmente e colocar a espiritualidade dentro de fórmulas mentais bloqueia o fluxo natural desse chakra. O campo energético se torna impermeável ao mistério e, ao mesmo tempo, vulnerável a rupturas internas, já que a energia acumulada sem vazão saudável acaba transbordando por fissuras. A limpeza desfaz essas tensões e a proteção se estabiliza com a aceitação do que não pode ser controlado, mas sim vivido com humildade.", "Rigidez": "Crenças fixas sobre como deve ser a conexão com o divino, ou sobre o que é certo ou errado espiritualmente, tornam o chakra coronário duro, limitado, sem fluidez. Essa rigidez gera julgamentos, comparações, sensação de separação. E é justamente essa separação que abre brechas energéticas. A limpeza libera essas crenças enrijecidas e a proteção se firma com a expansão da consciência e a permissão para acessar novos caminhos de conexão.", "Perfeccionismo e autoexigência": "O desejo de ser espiritual de forma impecável, sem falhas ou dúvidas, cria um padrão mental exaustivo que desconecta a pessoa do verdadeiro fluxo divino. A mente quer atingir um ideal de pureza ou iluminação, mas isso a afasta da essência. Essa autoexigência fragiliza o campo, pois qualquer erro interno é visto como falha vibracional. A limpeza dissolve essa ilusão de perfeição e a proteção se torna real quando a pessoa se reconhece digna exatamente como é, em processo.", "Forte e racional": "O excesso de racionalidade bloqueia a abertura espiritual, pois a mente tenta dar conta sozinha de questões que são do espírito. A pessoa pode se blindar com argumentos, resistir à entrega, evitar estados de presença mais sutis. Essa resistência gera tensão e isolamento energético. A limpeza libera esse excesso de pensamento e a proteção emerge da integração entre razão e fé, entre lucidez e rendição."}, "Solto": {"Agradadora": "No chakra coronário, o desejo inconsciente de agradar pode se traduzir em uma abertura espiritual indiscriminada. A pessoa busca se conectar com tudo e todos, sem discernimento, por medo de desagradar forças sutis ou de ser vista como não evoluída. Essa postura atrai interferências e confunde a percepção espiritual, pois a conexão não vem da essência, mas da necessidade de aceitação. A limpeza ajuda a desfazer essas concessões e a verdadeira proteção nasce da escolha consciente de com quem e com o quê se conectar.", "Sem identidade": "A ausência de uma identidade espiritual clara faz com que a pessoa se abra a todas as vozes, crenças e práticas sem filtrar o que realmente ressoa com sua essência. Isso enfraquece o campo, pois ela se torna vulnerável à manipulação energética, à influência de egregoras ou à perda do próprio eixo. A limpeza remove resíduos dessas conexões confusas e a proteção é construída quando a pessoa reconhece quem ela é, vibracionalmente, dentro do plano espiritual.", "Anulação": "A mente que acredita que não pode questionar o que vem do espiritual, anulando o próprio discernimento, abre um portal perigoso no chakra coronário. Essa anulação cria dependência, medo, submissão a crenças e práticas que não nutrem o ser. A limpeza resgata a soberania mental e a proteção se consolida com a coragem de pensar, sentir e validar a própria conexão com o sagrado.", "Submissão": "Padrões mentais de submissão fazem com que a pessoa entregue seu poder a figuras espirituais, gurus ou sistemas sem avaliar se aquilo realmente serve à sua alma. Isso fragiliza o chakra e expõe o campo a vínculos nocivos. A limpeza ajuda a romper pactos inconscientes e a proteção verdadeira surge com o exercício do livre-arbítrio espiritual e do pensamento crítico alinhado ao coração.", "Salvadora": "A mente que assume o papel de salvadora espiritual sente que precisa se abrir a tudo, carregar os outros, absorver dores e interferências para ajudar. Essa postura atrai cargas e fragmenta o campo sutil. A limpeza permite que a terapeuta ou buscadora espiritual libere essa função e a proteção se restabelece com o reconhecimento de que a verdadeira ajuda é vibracional, e não baseada em absorção ou sacrifício."}}}}, "pizzolLabelMap": {"Controle": "Controle seguro", "Perfeccionismo e Autoexigência": "Perfeccionismo e autoexigência", "Agradador/a": "Agradadora", "Salvadora": "Salvadora"}, "p2": {"Ambientes": ["Apartamento", "Área de Serviço", "Banheiro", "Casa", "Consultório", "Copa", "Cozinha", "Despensa", "Empresa", "Escritório", "Fábrica", "Fazenda", "Galpão", "Jardim", "Lavanderia", "Loja", "Quartos", "Sala de Estar", "Sala de Jantar", "Varanda", "Outros"],
